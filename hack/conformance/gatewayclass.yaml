# The GatewayClass the conformance suite runs against. Its Envoy Services are
# LoadBalancers so that cloud-provider-kind gives each Gateway an address the
# suite, running on the host, can reach. No tunnel: conformance covers Envoy,
# and the tunnel is covered by the envtest and e2e suites.
apiVersion: cloudflare.unmango.dev/v1alpha1
kind: CloudflareGatewayConfig
metadata:
  name: conformance
  namespace: cloudflare-operator-system
spec:
  # Every class names a tunnel. This one is never created, because the token
  # setup.sh installs is a dummy, and the suite reaches each Envoy at its
  # LoadBalancer address instead. warpRouting is what lets the class accept
  # HTTPS and UDP listeners and GRPCRoutes, so the suite exercises the Envoy
  # translation of those too.
  template:
    spec:
      accountId: conformance
      config:
        warpRouting:
          enable: true
  envoy:
    serviceType: LoadBalancer
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cloudflare-conformance
spec:
  controllerName: cloudflare.unmango.dev/gateway-controller
  parametersRef:
    group: cloudflare.unmango.dev
    kind: CloudflareGatewayConfig
    name: conformance
    namespace: cloudflare-operator-system
