name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - run: nix flake check
      - run: nix build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - run: nix develop -c make lint-config lint helm-lint

      # dist/chart is generated from config/ by the kubebuilder helm plugin and
      # committed. If this fails, run `make helm` and commit the result.
      - run: nix develop -c make helm
      - run: git diff --exit-code -- dist/chart PROJECT Makefile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # envtest cannot run inside the nix build sandbox, so the suites run
      # here rather than as part of `nix flake check`.
      - run: nix develop -c make test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - run: nix develop -c make test-e2e

      # `make test-e2e` deletes its cluster on the way out, so the chart gets a
      # fresh one. The dummy Secret is the point: an install that never resolves
      # the secretKeyRef proves nothing about the token wiring.
      - run: nix develop -c make setup-test-e2e kind-load
      - run: |
          nix develop -c bash -euo pipefail -c '
            export KUBECONFIG="$PWD/bin/cloudflare-operator-e2e.kubeconfig"
            kubectl create namespace cloudflare-operator-system
            kubectl create secret generic cloudflare-credentials \
              --namespace cloudflare-operator-system \
              --from-literal=CLOUDFLARE_API_TOKEN=dummy
            helm install cloudflare-operator dist/chart \
              --namespace cloudflare-operator-system \
              --set manager.image.repository=cloudflare-operator \
              --set manager.image.tag=latest \
              --set cloudflare.auth.apiTokenRef.name=cloudflare-credentials \
              --wait --timeout 5m
            helm status cloudflare-operator --namespace cloudflare-operator-system
          '

      - if: always()
        run: nix develop -c make cleanup-test-e2e

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@389dda3b9e44477f790e76d5474b700c1bb9b82d # v1.3.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - run: nix develop -c make setup-test-conformance

      # cloud-provider-kind gives each Gateway's Envoy Service a LoadBalancer
      # address on the kind network, which the runner can reach.
      - run: nix develop -c bash -c 'cloud-provider-kind > bin/cloud-provider-kind.log 2>&1 &'

      - run: nix develop -c make test-conformance

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: |
            bin/conformance-report.yaml
            bin/cloud-provider-kind.log
          if-no-files-found: ignore

      - if: failure()
        run: |
          nix develop -c bash -c '
            export KUBECONFIG="$PWD/bin/cloudflare-operator-e2e.kubeconfig"
            kubectl get gateways,httproutes,grpcroutes -A -o wide || true
            kubectl -n cloudflare-operator-system logs deploy/cloudflare-operator-controller-manager --tail=300 || true
          '

      - if: always()
        run: nix develop -c make cleanup-test-e2e
