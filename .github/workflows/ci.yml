name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - run: nix flake check
      - run: nix build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - run: nix develop -c make lint-config lint helm-lint

      # dist/chart is generated from config/ by the kubebuilder helm plugin and
      # committed. If this fails, run `make helm` and commit the result.
      - run: nix develop -c make helm
      - run: git diff --exit-code -- dist/chart PROJECT Makefile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # envtest cannot run inside the nix build sandbox, so the suites run
      # here rather than as part of `nix flake check`.
      - run: nix develop -c make test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - run: nix develop -c make test-e2e

      # `make test-e2e` deletes its cluster on the way out, so the chart gets a
      # fresh one. The dummy Secret is the point: an install that never resolves
      # the secretKeyRef proves nothing about the token wiring.
      - run: nix develop -c make setup-test-e2e kind-load
      - run: |
          nix develop -c bash -euo pipefail -c '
            export KUBECONFIG="$PWD/bin/cloudflare-operator-e2e.kubeconfig"
            kubectl create namespace cloudflare-operator-system
            kubectl create secret generic cloudflare-credentials \
              --namespace cloudflare-operator-system \
              --from-literal=CLOUDFLARE_API_TOKEN=dummy
            helm install cloudflare-operator dist/chart \
              --namespace cloudflare-operator-system \
              --set manager.image.repository=cloudflare-operator \
              --set manager.image.tag=latest \
              --set cloudflare.auth.apiTokenRef.name=cloudflare-credentials \
              --wait --timeout 5m
            helm status cloudflare-operator --namespace cloudflare-operator-system
          '

      - if: always()
        run: nix develop -c make cleanup-test-e2e
