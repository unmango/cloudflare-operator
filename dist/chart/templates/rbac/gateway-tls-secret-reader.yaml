{{- if .Values.rbac.gatewayTLSSecrets.enabled }}
{{- $name := include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-reader" "context" $) }}
# Always cluster scoped: a Gateway may take its certificates from any namespace
# a ReferenceGrant allows, and the manager watches them through one
# cluster-wide cache.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ $name }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-reader-binding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ include "cloudflare-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
