{{- $name := include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-reader" "context" $) }}
# Read access to Secrets, bound by nothing in the chart. The manager binds it
# with a RoleBinding in each namespace a Gateway may take listener certificates
# from: a Gateway's own namespace, and any namespace whose ReferenceGrants let
# a Gateway name a Secret there. Each RoleBinding is owned by this role, so
# uninstalling the chart removes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    # The manager finds this role by this label, since the chart names it
    # after the release.
    app.kubernetes.io/component: gateway-tls-secret-reader
  name: {{ $name }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
# Lets the manager find the role above and bind it, without holding the access
# it grants. The RoleBindings it creates are covered by the manager role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-binder" "context" $) }}
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - list
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - bind
  resourceNames:
  - {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-binder-binding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-binder" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "cloudflare-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
