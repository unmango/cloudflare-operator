{{- $name := include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-reader" "context" $) }}
# Read access to Secrets, bound by nothing in the chart. The manager binds it
# with a RoleBinding in each namespace a Gateway may take listener certificates
# from: a Gateway's own namespace, and any namespace whose ReferenceGrants let
# a Gateway name a Secret there. Each RoleBinding is owned by this role, so
# uninstalling the chart removes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    # The manager finds this role by this label, since the chart names it
    # after the release.
    app.kubernetes.io/component: gateway-tls-secret-reader
  name: {{ $name }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
# Lets the manager find the role above and bind it, without holding the access
# it grants. The RoleBindings it creates are covered by the manager role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-binder" "context" $) }}
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - list
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - bind
  resourceNames:
  - {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-binder-binding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-binder" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "cloudflare-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
{{- $sa := include "cloudflare-operator.serviceAccountName" . }}
{{- $policy := include "cloudflare-operator.resourceName" (dict "suffix" "gateway-tls-secret-bindings" "context" $) }}
---
# The manager may create, update and delete RoleBindings in any namespace, and
# bind the reader role above. Without this policy a compromised manager could
# bind that role to any identity, or tamper with RoleBindings it does not own.
# The policy holds the manager to the one binding it needs: the reader role,
# bound to its own service account.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ $policy }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - "*"
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - rolebindings
  matchConditions:
  - name: manager
    expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ $sa }}'
  variables:
  - name: binding
    expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
  - expression: variables.binding.roleRef.kind == 'ClusterRole' && variables.binding.roleRef.name == '{{ $name }}'
    message: The operator may only manage RoleBindings to {{ $name }}
  - expression: >-
      request.operation == 'DELETE' ||
      (has(object.subjects) && size(object.subjects) == 1 && object.subjects.all(s,
        s.kind == 'ServiceAccount' && s.name == '{{ $sa }}' && s.namespace == '{{ .Release.Namespace }}'))
    message: The operator may only bind {{ $name }} to its own service account
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cloudflare-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ $policy }}
spec:
  policyName: {{ $policy }}
  validationActions:
  - Deny
{{- end }}
